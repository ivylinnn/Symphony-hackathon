<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <!--
    AURAK 促销片尾卡 —— 按用户提供的参考图重建：
    只取促销信息与卡片风格（黑底、金属银大字、描边按钮），不含产品摄影。
  -->
  <defs>
    <!-- 底色：近黑，左上带一束很轻的顶光 -->
    <radialGradient id="spot" cx="0.32" cy="0.05" r="1.1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="0.45" stop-color="#101011"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>
    <!-- 金属银字：白 → 银灰的斜向渐变，模拟拉丝高光 -->
    <linearGradient id="silver" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#e9eaec"/>
      <stop offset="0.62" stop-color="#b9bcc0"/>
      <stop offset="1" stop-color="#94989d"/>
    </linearGradient>
    <!-- 地面：底部一层混凝土般的微光 -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#191a1b"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#232426"/>
      <stop offset="1" stop-color="#232426" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#spot)"/>

  <!-- 左上斜射的光束，很淡 -->
  <polygon points="0,0 260,0 620,760 240,760" fill="#ffffff" opacity="0.025"/>

  <!-- 地面与光池 -->
  <rect y="1560" width="1080" height="360" fill="url(#floor)"/>
  <ellipse cx="540" cy="1700" rx="430" ry="90" fill="url(#pool)" opacity="0.5"/>

  <!-- 品牌标记：A 形山峰 + 头顶一笔短檐 -->
  <g stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M468 268 L540 116 L612 268"/>
    <path d="M497 214 L583 214"/>
    <path d="M506 82 L540 50 L574 82"/>
  </g>
  <!-- 字标 -->
  <text x="557" y="352" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="66" font-weight="600" letter-spacing="34" fill="#ffffff">AURAK</text>

  <!-- SUMMER SALE -->
  <text x="554" y="596" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="500" letter-spacing="28" fill="#c9cbce">SUMMER SALE</text>

  <!-- 20% OFF：单行金属银大字 -->
  <text x="540" y="850" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="224" font-weight="900" letter-spacing="2" fill="url(#silver)">20% OFF</text>

  <!-- SHOP NOW 描边按钮 -->
  <g>
    <rect x="252" y="1566" width="576" height="118" fill="#0a0a0b" stroke="#e9e9ea" stroke-width="3"/>
    <text x="497" y="1640" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="44" font-weight="500" letter-spacing="18" fill="#ffffff">SHOP NOW</text>
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M706 1625 L762 1625"/>
      <path d="M740 1603 L762 1625 L740 1647"/>
    </g>
  </g>

  <!-- 域名收尾 -->
  <text x="551" y="1830" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="500" letter-spacing="22" fill="#b7b9bc">AURAK.COM</text>
</svg>
